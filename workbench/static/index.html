<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>产品工作台</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/modules/state.js" defer></script>
    <script src="/modules/constants.js" defer></script>
    <script src="/modules/utils.js" defer></script>
    <script src="/modules/api.js" defer></script>
    <script src="/modules/modal.js" defer></script>
    <script src="/render/workspace.js" defer></script>
    <script src="/features/projects.js" defer></script>
    <script src="/features/versions.js" defer></script>
    <script src="/features/materials.js" defer></script>
    <script src="/features/android_capture.js" defer></script>
    <script src="/features/integrations.js" defer></script>
    <script src="/features/competitor_dossiers.js" defer></script>
    <script src="/features/competitor_revenue.js" defer></script>
    <script src="/features/competitor_discovery.js" defer></script>
    <script src="/features/tasks.js" defer></script>
    <script src="/modules/markdown.js" defer></script>
    <script src="/features/outputs.js" defer></script>
    <script src="/modules/events.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand"><span class="mark">P</span>产品工作台</div>
      <div class="nav-head">
        <span class="nav-label">项目</span>
        <button class="icon-button" id="new-project" title="新建项目" aria-label="新建项目">＋</button>
      </div>
      <nav id="projects" aria-label="项目"></nav>
      <div class="sidebar-bottom">
        <button id="import-project">导入项目包</button>
        <button id="capabilities">能力与工具</button>
        <button id="trash">回收站</button>
        <div class="local-status"><span></span>本地运行 · 单人工作台</div>
      </div>
    </aside>
    <main>
      <div id="banner" class="banner" role="status" hidden></div>
      <section id="content">
        <div class="empty">正在连接本地工作台…</div>
      </section>
    </main>
    <dialog id="modal" aria-labelledby="modal-label">
      <div class="modal-top">
        <span id="modal-label">工作台</span
        ><button id="close-modal" aria-label="关闭">×</button>
      </div>
      <div id="modal-body"></div>
    </dialog>
    <div id="toast" role="status" hidden></div>
  </body>
</html>
